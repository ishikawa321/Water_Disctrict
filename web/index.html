<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="theme-color" content="#081b3d">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Maramag Water District billing, service concerns, repair updates, and district notices.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Water District Connect">
  <link rel="apple-touch-icon" href="district-logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="district-logo.png"/>

  <title>Water District Connect</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #081b3d; }
    #app-loader {
      position: fixed; inset: 0; display: grid; place-items: center;
      padding: 28px; background: #081b3d; color: #fff;
      font-family: system-ui, sans-serif; text-align: center;
    }
    #app-loader .brand {
      width: 92px; height: 92px; padding: 12px; border-radius: 50%;
      background: #cdf7fa; box-shadow: 0 0 36px #cdf7fa20;
    }
    #app-loader h1 { font-size: 32px; line-height: 1.15; letter-spacing: -.8px; }
    #app-loader p { color: #bdccdf; font-size: 14px; }
    #app-loader .indicator {
      display: inline-grid; place-items: center; padding: 12px;
      margin-top: 20px; background: #0648d7; border-radius: 18px;
    }
    #app-loader .spinner {
      width: 24px; height: 24px; box-sizing: border-box;
      border: 2.5px solid #cdf7fa40; border-top-color: #cdf7fa;
      border-radius: 50%; animation: loading-spin .9s linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #app-loader .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div>
      <img class="brand" src="district-logo.png" alt="Maramag Water District logo">
      <h1>Water District<br>Connect</h1>
      <p>Maramag, Philippines</p>
      <span class="indicator" aria-hidden="true"><span class="spinner"></span></span>
      <p>Preparing your water-service app&hellip;</p>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loader')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
